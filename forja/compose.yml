services:
  bd:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - pg-datos:/var/lib/postgresql
    networks:
      - interna
    restart: unless-stopped
  cache:
    image: redis:7.2
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_CONTRASENA:?falta en el fichero .env}
    volumes:
      - cache-datos:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
  correo:
    image: axllent/mailpit:v1.32
    networks:
      - interna
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped
  forgejo:
    image: codeberg.org/forgejo/forgejo:17
    environment:
      FORGEJO__database__DB_TYPE: ${FORGEJO__database__DB_TYPE}
      FORGEJO__database__HOST: ${FORGEJO__database__HOST}
      FORGEJO__database__NAME: ${FORGEJO__database__NAME}
      FORGEJO__database__USER: ${FORGEJO__database__USER}
      FORGEJO__database__PASSWORD: ${FORGEJO__database__PASSWORD}
      FORGEJO__server__DOMAIN: ${FORGEJO__server__DOMAIN}
      FORGEJO__server__ROOT_URL: ${FORGEJO__server__ROOT_URL}
      FORGEJO__server__SSH_PORT: ${FORGEJO__server__SSH_PORT}
      FORGEJO__server__SSH_LISTEN_PORT: ${FORGEJO__server__SSH_LISTEN_PORT}
      FORGEJO__security__INSTALL_LOCK: ${FORGEJO__security__INSTALL_LOCK}
      FORGEJO__mailer__ENABLED: ${FORGEJO__mailer__ENABLED}
      FORGEJO__mailer__PROTOCOL: ${FORGEJO__mailer__PROTOCOL}
      FORGEJO__mailer__SMTP_ADDR: ${FORGEJO__mailer__SMTP_ADDR}
      FORGEJO__mailer__SMTP_PORT: ${FORGEJO__mailer__SMTP_PORT}
      FORGEJO__mailer__FROM: ${FORGEJO__mailer__FROM}
      FORGEJO__cache__ADAPTER: ${FORGEJO__cache__ADAPTER}
      FORGEJO__cache__HOST: ${FORGEJO__cache__HOST}
      FORGEJO__session_PROVIDER: ${FORGEJO__session_PROVIDER}
      FORGEJO__session__PROVIDER_CONFIG: ${FORGEJO__session__PROVIDER_CONFIG}
      FORGEJO__queue__TYPE: ${FORGEJO__queue__TYPE}
      FORGEJO__queue__CONN_STR: ${FORGEJO__queue__CONN_STR}
      USER_UID: ${USER_UID}
      USER_GID: ${USER_GID}
    depends_on:
      bd:
        condition: service_healthy
      correo:
        condition: service_started
      cache:
        condition: service_healthy
    networks:
      - interna
volumes:
  pg-datos:
  cache-datos:
networks:
  interna: