services:
  bd:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - pg-datos:/var/lib/postgresql
    networks:
      - interna
    restart: unless-stopped
  cache:
    image: redis:7.2
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_CONTRASENA:?falta en el fichero .env}
    volumes:
      - cache-datos:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
  correo:
    image: axllent/mailpit:v1.32
    networks:
      - interna
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped
volumes:
  pg-datos:
  cache-datos:
networks:
  interna: